<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Masuk ke akun EaterSive untuk memesan layanan perawatan sepatu."
    />
    <title>Masuk ke Akun — EaterSive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand" href="../eatersive-landing-page/index.html" aria-label="Kembali ke EaterSive">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 14.2c2.1-.2 3.6-1.5 4.5-4.1l1.3.5c1.5 2.2 3.2 3.6 6.1 4l3.3.5c1.2.2 1.9 1 1.9 2.1 0 1.2-.9 2-2.1 2H6.2C4.4 19.2 3 18 3 16.4c0-.9.4-1.6 1-2.2Z" fill="currentColor"/>
              <path d="m9.7 11.2 1.2.8m1.1.1 1.2.7m1.2.1 1.2.6" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Eater<span class="brand-accent">Sive</span></span>
        </a>

        <div class="login-heading">
          <h1 id="login-title">Buat Akun Anda</h1>
          <p>Daftar untuk memesan layanan cuci sepatu<br class="desktop-break" /> dengan lebih mudah</p>
        </div>

        <form class="login-form" id="login-form">
          <div class="field-group">
            <label for="email">Alamat Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m5 7 7 5.5L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required />
            </div>
          </div>

          <div class="field-group">
            <div class="label-row">
              <label for="password">Kata Sandi</label>
              <button class="text-button" type="button" id="forgot-password">Lupa kata sandi?</button>
            </div>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4.5" y="10" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <input id="password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required />
              <button class="password-toggle" type="button" id="toggle-password" aria-label="Tampilkan kata sandi" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
          </div>

          <label class="remember-option" for="remember">
            <input id="remember" name="remember" type="checkbox" />
            <span>Ingat saya di perangkat ini</span>
          </label>

          <button class="submit-button" type="submit">Masuk ke Akun</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="divider"><span>Atau lanjut dengan</span></div>

        <div class="social-login">
          <button class="social-button" type="button" data-provider="Google">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.42-.19-2.09H12v3.95h5.38a4.6 4.6 0 0 1-2 3.02v2.47h3.23c1.89-1.74 2.99-4.3 2.99-7.35Z"/>
              <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.42l-3.24-2.47c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.76-5.59-4.12H3.06v2.55A10 10 0 0 0 12 22Z"/>
              <path fill="#FBBC05" d="M6.41 13.95a6 6 0 0 1 0-3.9V7.5H3.06a10 10 0 0 0 0 9l3.35-2.55Z"/>
              <path fill="#EA4335" d="M12 5.93c1.47 0 2.79.5 3.83 1.52l2.87-2.87C16.96 2.96 14.69 2 12 2a10 10 0 0 0-8.94 5.5l3.35 2.55C7.2 7.69 9.4 5.93 12 5.93Z"/>
            </svg>
            Google
          </button>
          <button class="social-button" type="button" data-provider="Facebook">
            <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="currentColor"/>
              <path fill="#fff" d="M13.45 19v-6.37h2.14l.32-2.48h-2.46V8.57c0-.72.2-1.21 1.23-1.21h1.32V5.14c-.23-.03-1.05-.1-2-.1-1.98 0-3.34 1.2-3.34 3.42v1.69H8.42v2.48h2.24V19h2.79Z"/>
            </svg>
            Facebook
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
